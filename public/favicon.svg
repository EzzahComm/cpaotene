<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="5" fill="#0B1F3A"/>

  <!-- "CPA" text in white -->
  <text
    x="16"
    y="13.5"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="9.5"
    text-anchor="middle"
    fill="#FFFFFF"
    letter-spacing="0.8"
  >CPA</text>

  <!-- Gold divider line -->
  <line x1="7" y1="16.5" x2="25" y2="16.5" stroke="#C8A24D" stroke-width="0.8"/>

  <!-- Gold checkmark -->
  <polyline
    points="9,22 13,26.5 23.5,18"
    stroke="#C8A24D"
    stroke-width="2.8"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
